/* 自訂題型 carbonTiles:有方向的管線方塊(碳循環)。
   每塊方塊連接兩個站點 a、b,點一下轉 90 度,狀態依序是 a→b、不通、b→a、不通。
   關卡欄位:
     tiles:  [{ label, a, b }, ...]     方塊的名稱和兩端的站點
     answer: ["ab" | "ba" | "off", ...] 每塊的正確狀態(ab = a→b、ba = b→a、off = 不通)
     start:  同上,一開始的狀態
     mistakes: { "編號:狀態": "給學生的話" },例如 "10:C→B"、"2:不通"(編號從 1 算,狀態寫畫面上顯示的樣子)
   比對常見錯誤時,題型把「mistakes 裡第一個符合玩家目前擺法的那一條」當作 given 交給引擎;
   都不符合時 given 是全部方塊的狀態(「1:A→B、2:…」)。 */
const CT_CYCLE = ["ab", "off", "ba", "off"];
const CT_text = (t, s) => s === "ab" ? `${t.a}→${t.b}` : s === "ba" ? `${t.b}→${t.a}` : "不通";
const CT_norm = (s) => String(s).normalize("NFKC").replace(/\s+/g, "");
const LEVEL_TYPES = {
  carbonTiles: {
    validate(lv) {
      const errors = [], warnings = [], STATES = ["ab", "ba", "off"];
      if (!Array.isArray(lv.tiles) || lv.tiles.length < 2 || lv.tiles.some(t => !t || !isText(t.label) || !isText(t.a) || !isText(t.b))) {
        return ["tiles 要是至少 2 塊的陣列,每塊寫成 { label: \"名稱\", a: \"站點\", b: \"站點\" }"];
      }
      const n = lv.tiles.length;
      ["answer", "start"].forEach(k => {
        if (!Array.isArray(lv[k]) || lv[k].length !== n || lv[k].some(s => !STATES.includes(s))) errors.push(`${k} 要有 ${n} 個,每個是 "ab"、"ba" 或 "off"`);
      });
      if (errors.length) return errors;
      if (lv.start.every((s, i) => s === lv.answer[i])) warnings.push("start 一開始就是答案,換一組起始狀態");
      if (lv.mistakes !== undefined) {
        if (!lv.mistakes || typeof lv.mistakes !== "object" || Array.isArray(lv.mistakes)) errors.push('mistakes 要寫成 { "編號:狀態": "給學生的話" }');
        else Object.entries(lv.mistakes).forEach(([k, v]) => {
          if (!isText(v)) errors.push(`mistakes 的「${k}」要寫給學生的話`);
          const m = /^(\d+):(.+)$/.exec(CT_norm(k)), i = m ? Number(m[1]) - 1 : -1;
          if (!m || i < 0 || i >= n) { errors.push(`mistakes 的「${k}」要寫成「編號:狀態」,編號 1 到 ${n},例如 "10:C→B"`); return; }
          const can = STATES.map(s => CT_text(lv.tiles[i], s));
          if (!can.includes(m[2])) errors.push(`mistakes 的「${k}」:第 ${i + 1} 塊只能是 ${can.join("、")}`);
          else if (m[2] === CT_text(lv.tiles[i], lv.answer[i])) errors.push(`mistakes 的「${k}」其實是正確答案`);
        });
      }
      return { errors, warnings };
    },
    render(lv, ctx) {
      const pos = lv.start.map(s => CT_CYCLE.indexOf(s));
      const grid = mk("div", "seq-grid");
      grid.style.gridTemplateColumns = "repeat(2, 1fr)";
      const ok = confirmBtn(lv);
      let touched = false, locked = false;
      const cur = (i) => CT_CYCLE[pos[i] % 4];
      const btns = lv.tiles.map((t, i) => {
        const b = mk("button", "seq-btn ct-tile");
        b.dataset.tile = i;
        b.addEventListener("click", () => {
          if (locked) return;
          touched = true;
          pos[i] = (pos[i] + 1) % 4;
          ctx.tone(260 + pos[i] * 50, 0.06, "triangle");
          paint();
        });
        grid.appendChild(b);
        return b;
      });
      function paint() {
        btns.forEach((b, i) => {
          const t = lv.tiles[i], s = cur(i);
          b.textContent = `${i + 1}. ${t.label}\n${s === "off" ? "═ 不通 ═" : CT_text(t, s)}`;
          b.setAttribute("aria-label", `第 ${i + 1} 塊,${t.label},連接 ${t.a} 和 ${t.b},目前 ${CT_text(t, s)}`);
          b.style.opacity = s === "off" ? ".7" : "1";
          b.disabled = locked;
        });
        ok.disabled = locked;
      }
      ok.addEventListener("click", () => {
        if (!touched) return;                      // 還沒轉過任何一塊就按,不算答錯
        locked = true; paint();
        const now = lv.tiles.map((t, i) => `${i + 1}:${CT_text(t, cur(i))}`);
        const right = lv.tiles.every((_, i) => cur(i) === lv.answer[i]);
        const hit = Object.keys(lv.mistakes || {}).find(k => now.includes(CT_norm(k)));
        ctx.answer(right, hit || now.join("、")).then(() => { locked = false; paint(); });   // 答錯保留擺法,讓玩家調整
      });
      ctx.top.appendChild(grid);
      ctx.top.appendChild(ok);
      paint();
    }
  }
};

/* 結算多顯示剩餘時間 */
function summaryRows(info) {
  return [
    ["研究員", info.playerName],
    ["打開的關卡", `${info.levelsPassed} / ${info.totalLevels}`],
    ["答錯次數", String(info.wrongCount)],
    ["看了幾層提示", String(info.hintsUsed)],
    ["獲得星星", `${info.totalStars} / ${info.totalLevels * 3}`],
    ["潮水剩餘時間", `${Math.floor(info.timeLeft / 60)} 分 ${info.timeLeft % 60} 秒`]
  ];
}
/* ===== RULES-PACK:END ===== */
</script>

<script>

/* =========================================================
   第三部分:遊戲流程(引擎)—— 通常不需要修改
   引擎負責:關卡狀態機、進度、愛心、倒數、星星、線索、道具、提示、音效、存檔與續玩、結算、上傳成績。
   每一關的作答畫面由「題型」負責(內建十種,可在第二部分新增)。
   ========================================================= */

/* 遊戲狀態(不要改既有欄位名稱,底下的函式都依賴這些欄位) */
let state = {
  currentLevel: 0,
  correctCount: 0,
  wrongCount: 0,
  startTime: null,
  playerName: "",
  lives: 0,        // 剩幾顆愛心(GAME.lives 大於 0 時才有意義)
  levelWrong: 0,   // 目前這一關答錯幾次(給星星用)
  stars: [],       // 每個已通過的關卡拿到幾顆星
  items: [],       // 已經拿到的道具 id
  hintsUsed: 0,    // 整場看了幾層提示
  levelHints: 0,   // 目前這一關看了幾層提示
  timeLeft: 0      // 倒數剩幾秒(GAME.timeLimit 大於 0 時才有意義)
};

const el = (id) => document.getElementById(id);
const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
const escapeHtml = (s) => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const isText = (s) => typeof s === "string" && !!s.trim();
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const ITEM_DEFS = (typeof ITEMS !== "undefined" && ITEMS) ? ITEMS : {};
const THEMES = ["cute", "warm", "parchment", "scifi", "terminal"];
const hintsOf = (level) => (Array.isArray(level.hints) && level.hints.length) ? level.hints : (level.hint ? [level.hint] : []);
const itemLabel = (id) => { const it = ITEM_DEFS[id] || {}; return `${it.icon ? it.icon + " " : ""}${it.name || id}`; };

/* ---------- 規則的預設版本 ----------
   第二部分沒有寫某個函式時,引擎改用這裡的版本。引擎一律透過 rule("名稱", ...參數) 呼叫 */
const DEFAULT_RULES = {
  levelStars(wrongTries, level, hintsUsed) {
    const n = wrongTries + Math.max(0, (hintsUsed || 0) - 1);
    return n === 0 ? 3 : n === 1 ? 2 : 1;
  },
  summaryRows(info) {
    const rows = [["玩家", info.playerName], ["通過關卡", `${info.levelsPassed} / ${info.totalLevels}`], ["答錯次數", String(info.wrongCount)]];
    if (LEVELS.some(lv => hintsOf(lv).length > 1)) rows.push(["看了幾層提示", String(info.hintsUsed)]);
    if (GAME.showStars) rows.push(["獲得星星", `${info.totalStars} / ${info.totalLevels * 3}`]);
    rows.push(["花費時間", `${info.durationSec} 秒`]);
    return rows;
  },
  validateRules() { return { errors: [], warnings: [] }; }
};
function rule(name, ...args) {
  const fn = typeof window[name] === "function" ? window[name] : DEFAULT_RULES[name];
  return fn(...args);
}

/* ---------- 音效(Web Audio 合成,不用音檔)與浮動訊息 ---------- */
let audioCtx = null;
let soundOn = GAME.sound !== false;
function tone(freq, dur = 0.15, type = "sine", vol = 0.08, delay = 0) {
  if (!soundOn) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = audioCtx || new AC();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const t = audioCtx.currentTime + delay, osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur);
  } catch (e) { /* 沒有聲音不影響遊戲 */ }
}
/* 每個音效是一串 [頻率, 秒數, 延遲, 波形] */
const SFX = {
  click: [[700, 0.05]],
  right: [[523, 0.15], [659, 0.15, 0.1], [784, 0.3, 0.2]],
  wrong: [[180, 0.2, 0, "sawtooth"], [140, 0.25, 0.15, "sawtooth"]],
  item:  [[880, 0.1], [1175, 0.25, 0.08]],
  win:   [[523, 0.15], [659, 0.15, 0.12], [784, 0.15, 0.24], [1047, 0.5, 0.36]],
  fail:  [[300, 0.3, 0, "triangle"], [220, 0.3, 0.25, "triangle"], [150, 0.6, 0.5, "triangle"]]
};
function sfx(name) { (SFX[name] || []).forEach(([f, d, delay, type]) => tone(f, d, type || "sine", 0.08, delay || 0)); }
function toast(msg) {
  const t = mk("div", "toast", msg);
  t.setAttribute("role", "status");
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

/* ---------- 內建題型 ---------- */
const confirmBtn = (lv) => mk("button", "btn-primary btn-confirm", (lv && lv.confirmLabel) || "✓ 確認");
const isNum = (n) => typeof n === "number" && Number.isFinite(n);

/* 轉輪鎖:把答案拆成每個轉輪的答案,並決定每個轉輪有哪些選項 */
function dialParts(lv) {
  const ans = Array.isArray(lv.answer) ? lv.answer.map(String) : String(lv.answer).split("");
  const preset = ans.every(a => /^[0-9]$/.test(a)) ? "0123456789".split("")
    : ans.every(a => /^[A-Z]$/.test(a)) ? "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("") : null;
  const w = lv.wheels;
  const wheels = ans.map((_, i) => !Array.isArray(w) ? preset : (Array.isArray(w[0]) ? w[i] : w));
  return { ans, wheels: wheels.map(o => Array.isArray(o) ? o.map(String) : o) };
}
/* 轉輪之間的分隔字:sep 是字串時每兩個轉輪之間都放;是陣列時 sep[0] 放在第 1、2 個轉輪之間… */
const sepAt = (lv, i) => Array.isArray(lv.sep) ? String(lv.sep[i - 1] || "") : (lv.sep || "");
/* 玩家轉出來的樣子(例如 "上午10:00"),給 mistakes 比對 */
const dialKey = (lv, vals) => vals.map((v, i) => (i ? sepAt(lv, i) : "") + v).join("");
/* 計數、滑桿共用:數值範圍 */
function rangeOf(lv, defMax) {
  const min = isNum(lv.min) ? lv.min : 0, max = isNum(lv.max) ? lv.max : defMax, step = isNum(lv.step) ? lv.step : 1;
  return { min, max, step, start: isNum(lv.start) ? lv.start : min };
}
function validateRange(lv, defMax) {
  if (!isNum(lv.answer)) return ["answer 要是數字(不要加引號)"];
  const { min, max, step, start } = rangeOf(lv, defMax), e = [];
  if (!(min < max)) e.push("min 要比 max 小");
  if (!(step > 0)) e.push("step 要大於 0");
  if (e.length) return e;
  if (lv.answer < min || lv.answer > max) e.push(`answer(${lv.answer})要在 ${min} 到 ${max} 之間`);
  if (start < min || start > max) e.push(`start(${start})要在 ${min} 到 ${max} 之間`);
  const off = Math.abs((lv.answer - start) / step);
  if (!(lv.tolerance > 0) && Math.abs(off - Math.round(off)) > 1e-9) e.push(`從 ${start} 每次加減 ${step},到不了 answer(${lv.answer})`);
  return e.length ? e : { errors: [], warnings: start === lv.answer ? ["一開始的數值就是答案,用 start 換一個起點"] : [] };
}
const fmtNum = (n) => String(Math.round(n * 1000) / 1000);

/* 旋轉水管共用:方向 0 上、1 右、2 下、3 左。沒轉的時候 I 開口是上下、L 是上右、T 是上右下 */
const PIPE_SHAPES = { I: [0, 2], L: [0, 1], T: [0, 1, 2] };
const PIPE_NAMES = { I: "直管", L: "彎管", T: "三通管" };
const pipeOpenings = (kind, rot) => PIPE_SHAPES[kind].map(d => (d + rot) % 4);
/* 照規則算水流到哪裡。回傳 { wet: 有水的格子, problem: 沒過關的原因("" = 過關) } */
function pipeFlow(lv, rots) {
  const n = lv.size, last = n * n - 1, wet = new Set();
  const open = (i) => pipeOpenings(lv.tiles[i], rots[i] % 4);
  let leak = false, out = false;
  if (open(0).includes(0)) {
    const todo = [0];
    wet.add(0);
    while (todo.length) {
      const i = todo.pop();
      open(i).forEach(d => {
        if (i === 0 && d === 0) return;                    // 入口
        if (i === last && d === 2) { out = true; return; } // 出口
        const r = Math.floor(i / n) + [-1, 0, 1, 0][d], c = i % n + [0, 1, 0, -1][d];
        if (r < 0 || c < 0 || r >= n || c >= n) { leak = true; return; }
        const j = r * n + c;
        if (!open(j).includes((d + 2) % 4)) { leak = true; return; }
        if (!wet.has(j)) { wet.add(j); todo.push(j); }
      });
    }
  }
  const missed = (lv.valves || []).filter(i => !wet.has(i)).length;
  const problem = (lv.shocks || []).some(i => wet.has(i)) ? "⚡ 接到危險的那一格了!"
    : !wet.size ? "左上角的管子沒有接上入口"
    : leak ? "有開口沒接上,漏出來了"
    : !out ? "還沒接到右下角的出口"
    : missed ? `還有 ${missed} 個閥門沒有接通` : "";
  return { wet, problem };
}

const BUILTIN_TYPES = {

  /* 選擇題 */
  choice: {
    validate(lv) {
      const e = [];
      if (!Array.isArray(lv.choices) || lv.choices.length < 2) {
        e.push("choices 至少要有 2 個選項");
      } else {
        if (lv.choices.some(c => !isText(c))) e.push("choices 每個選項都要是不空白的文字");
        if (!Number.isInteger(lv.answerIndex) || lv.answerIndex < 0 || lv.answerIndex >= lv.choices.length) {
          e.push(`answerIndex 要是 0 到 ${lv.choices.length - 1} 的整數(從 0 開始算)`);
        }
      }
      return e;
    },
    render(lv, ctx) {
      const order = lv.choices.map((_, i) => i);
      const shown = (lv.shuffle !== undefined ? lv.shuffle : GAME.shuffleChoices) !== false ? shuffle(order) : order;   // 存原本的索引,answerIndex 不用改
      const btns = shown.map(i => mk("button", "choice", lv.choices[i]));
      const lock = (v) => btns.forEach(b => { b.disabled = v; });
      btns.forEach((b, k) => b.addEventListener("click", () => {
        lock(true);
        const ok = shown[k] === lv.answerIndex;
        b.classList.add(ok ? "correct" : "wrong");
        ctx.answer(ok, lv.choices[shown[k]]).then(() => { b.classList.remove("wrong"); lock(false); });
      }));
      btns.forEach(b => ctx.top.appendChild(b));
    }
  },

  /* 複選題:要選的全部選到、不該選的都沒選,才算對 */
  multi: {
    validate(lv) {
      const e = [];
      if (!Array.isArray(lv.choices) || lv.choices.length < 2 || lv.choices.some(c => !isText(c))) return ["choices 至少要有 2 個不空白的選項"];
      const a = lv.answerIndexes;
      if (!Array.isArray(a) || !a.length) e.push("answerIndexes 要是陣列,寫出所有正確選項的索引(從 0 算),例如 [0, 2]");
      else if (a.some(i => !Number.isInteger(i) || i < 0 || i >= lv.choices.length)) e.push(`answerIndexes 裡的每個數字要是 0 到 ${lv.choices.length - 1} 的整數`);
      else if (new Set(a).size !== a.length) e.push("answerIndexes 裡有重複的索引");
      return e;
    },
    render(lv, ctx) {
      const order = lv.choices.map((_, i) => i);
      const shown = (lv.shuffle !== undefined ? lv.shuffle : GAME.shuffleChoices) !== false ? shuffle(order) : order;
      const picked = new Set();
      const ok = confirmBtn(lv);
      const btns = shown.map(i => {
        const b = mk("button", "choice", lv.choices[i]);
        b.setAttribute("aria-pressed", "false");
        b.addEventListener("click", () => {
          picked.has(i) ? picked.delete(i) : picked.add(i);
          b.classList.toggle("picked", picked.has(i));
          b.setAttribute("aria-pressed", String(picked.has(i)));
        });
        ctx.top.appendChild(b);
        return b;
      });
      const lock = (v) => { btns.forEach(b => { b.disabled = v; }); ok.disabled = v; };
      ok.addEventListener("click", () => {
        if (!picked.size) return;
        lock(true);
        const right = picked.size === lv.answerIndexes.length && lv.answerIndexes.every(i => picked.has(i));
        ctx.answer(right, lv.choices.filter((_, i) => picked.has(i)).join("、")).then(() => lock(false));     // 答錯保留玩家的選擇,讓他修改
      });
      ctx.top.appendChild(ok);
    }
  },

  /* 密碼鍵盤:答案只能用 0-9、* 和 # */
  passcode: {
    validate(lv) {
      if (typeof lv.answer !== "string") return ['answer 要用字串,例如 "7" 而不是 7'];
      if (!/^[0-9*#]+$/.test(lv.answer)) return [`answer 只能用 0-9、* 和 #(目前是 "${lv.answer}");有字母或中文請改用 text 或 dial`];
      if (lv.slots !== undefined && !(Number.isInteger(lv.slots) && lv.slots >= lv.answer.length && lv.slots <= 8)) return [`slots 要是 ${lv.answer.length} 到 8 的整數(格子數,不能比答案短)`];
      return [];
    },
    render(lv, ctx) {
      // 電話鍵盤排列:1-9、* 0 #,最下排是刪除與確認(確認鍵佔兩格)
      const LAYOUT = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "*", "0", "#", "⌫", "✓"];
      const slots = lv.slots || lv.answer.length;     // slots 可以比答案長,避免格子數洩漏答案位數
      let input = "";
      const display = mk("div", "passcode-display");
      const keypad = mk("div", "keypad");
      ctx.top.appendChild(display);
      ctx.bottom.appendChild(keypad);

      function paint() {
        display.innerHTML = "";
        for (let i = 0; i < slots; i++) display.appendChild(mk("div", "passcode-slot" + (input[i] ? " filled" : ""), input[i] || ""));
      }
      const keys = LAYOUT.map(label => {
        const b = mk("button", "key", label);
        b.dataset.key = label;
        if (label === "*" || label === "#") b.classList.add("symbol");
        if (label === "⌫") { b.classList.add("back"); b.setAttribute("aria-label", "刪除"); }
        if (label === "✓") { b.classList.add("confirm"); b.textContent = "✓ 確認"; }
        b.addEventListener("click", () => press(label));
        keypad.appendChild(b);
        return b;
      });
      const lock = (v) => keys.forEach(k => { k.disabled = v; });

      function press(label) {
        if (label === "⌫") { input = input.slice(0, -1); paint(); return; }
        if (label === "✓") { submit(); return; }
        if (input.length < slots) { input += label; paint(); }
      }
      function submit() {
        if (input.length === 0) return;      // 還沒輸入就按確認,不算答錯
        lock(true);
        const ok = input === lv.answer;
        if (!ok) display.classList.add("passcode-shake");
        ctx.answer(ok, input).then(() => {
          display.classList.remove("passcode-shake");
          input = "";
          paint();
          lock(false);
        });
      }
      // 電腦上也可以直接用實體鍵盤輸入數字、*、#、Backspace、Enter
      function onKey(e) {
        const label = e.key === "Backspace" ? "⌫" : e.key === "Enter" ? "✓" : (/^[0-9*#]$/.test(e.key) ? e.key : null);
        if (!label) return;
        const btn = keys.find(k => k.dataset.key === label);
        if (!btn || btn.disabled) return;
        e.preventDefault();
        btn.classList.add("pressed");
        setTimeout(() => btn.classList.remove("pressed"), 100);
        press(label);
      }
      document.addEventListener("keydown", onKey);
      paint();
      return () => document.removeEventListener("keydown", onKey);
    }
  },

  /* 文字題:玩家用鍵盤輸入文字,answer 可以是字串或字串陣列(都算對) */
  text: {
    validate(lv) {
      const list = Array.isArray(lv.answer) ? lv.answer : [lv.answer];
      if (!list.length || list.some(a => !isText(a))) {
        return ['answer 要是不空白的字串,或是字串陣列(例如 ["cat", "Cat"])'];
      }
      return [];
    },
    render(lv, ctx) {
      const norm = (s) => {
        const t = String(s).normalize("NFKC").trim().replace(/\s+/g, " ");
        return lv.caseSensitive ? t : t.toLowerCase();
      };
      const accepted = [].concat(lv.answer).map(norm);
      const input = mk("input", "text-answer");
      input.type = "text";
      input.placeholder = lv.placeholder || "在這裡輸入答案";
      input.autocomplete = "off";
      input.setAttribute("autocapitalize", "off");
      input.setAttribute("spellcheck", "false");
      const ok = confirmBtn(lv);
      ctx.top.appendChild(input);
      ctx.top.appendChild(ok);

      function submit() {
        if (!input.value.trim()) return;      // 還沒輸入就按確認,不算答錯
        input.disabled = ok.disabled = true;
        const right = accepted.includes(norm(input.value));
        if (!right) input.classList.add("passcode-shake");
        ctx.answer(right, input.value).then(() => {
          input.classList.remove("passcode-shake");
          input.value = "";
          input.disabled = ok.disabled = false;
          input.focus();
        });
      }
      ok.addEventListener("click", submit);
      input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) submit(); });
      input.focus();
    }
  },

  /* 轉輪鎖:每個轉輪用 ▲▼ 轉到正確的字 */
  dial: {
    validate(lv) {
      const okAnswer = isText(lv.answer) || (Array.isArray(lv.answer) && lv.answer.length && lv.answer.every(isText));
      if (!okAnswer) return ['answer 要是字串(每個字一個轉輪,例如 "GOLD")或字串陣列(例如 ["11", "45"])'];
      const { ans, wheels } = dialParts(lv), errors = [];
      ans.forEach((a, i) => {
        const opts = wheels[i];
        if (!Array.isArray(opts) || opts.length < 2) errors.push(`第 ${i + 1} 個轉輪沒有選項:答案不是「全部數字」或「全部大寫字母」時,要用 wheels 寫出轉輪的選項`);
        else if (!opts.includes(a)) errors.push(`第 ${i + 1} 個轉輪的選項裡沒有答案「${a}」`);
      });
      const warnings = [];
      if (!errors.length && ans.every((a, i) => wheels[i][0] === a)) warnings.push("轉輪一開始的位置就是答案,調整 wheels 的順序");
      if (ans.length > 6) warnings.push("轉輪超過 6 個,在手機上可能排不下");
      if (!errors.length && wheels.some(o => o.some(x => x.length > 5))) warnings.push("有轉輪選項超過 5 個字,在手機上可能擠不下");
      if (Array.isArray(lv.sep) && lv.sep.length !== ans.length - 1) warnings.push(`sep 寫成陣列時,要有 ${ans.length - 1} 個(每兩個轉輪之間一個,不要分隔就寫 "")`);
      return { errors, warnings };
    },
    render(lv, ctx) {
      const { ans, wheels } = dialParts(lv);
      const pos = ans.map(() => 0);
      const row = mk("div", "dial");
      const ok = confirmBtn(lv);
      const btns = [];
      let touched = false;
      wheels.forEach((opts, i) => {
        if (i && sepAt(lv, i)) row.appendChild(mk("span", "dial-sep", sepAt(lv, i)));
        const w = mk("div", "wheel"), val = mk("div", "wheel-val" + (opts.some(o => o.length > 2) ? " long" : ""), opts[0]);
        const turn = (d) => {
          touched = true;
          pos[i] = (pos[i] + d + opts.length) % opts.length;
          val.textContent = opts[pos[i]];
          val.classList.remove("turn"); void val.offsetWidth; val.classList.add("turn");
          ctx.tone(300 + pos[i] * 12, 0.04, "triangle");
        };
        [["▲", -1, "上一個"], ["▼", 1, "下一個"]].forEach(([label, d, aria], k) => {
          const b = mk("button", "wheel-btn", label);
          b.dataset.wheel = i; b.dataset.dir = d;
          b.setAttribute("aria-label", `第 ${i + 1} 個轉輪:${aria}`);
          b.addEventListener("click", () => turn(d));
          btns.push(b);
          if (k === 0) { w.appendChild(b); w.appendChild(val); } else w.appendChild(b);
        });
        row.appendChild(w);
      });
      const lock = (v) => { btns.forEach(b => { b.disabled = v; }); ok.disabled = v; };
      ok.addEventListener("click", () => {
        if (!touched) return;
        lock(true);
        const right = pos.every((p, i) => wheels[i][p] === ans[i]);
        if (!right) row.classList.add("passcode-shake");
        ctx.answer(right, dialKey(lv, pos.map((p, i) => wheels[i][p]))).then(() => { row.classList.remove("passcode-shake"); lock(false); });
      });
      ctx.top.appendChild(row);
      ctx.top.appendChild(ok);
    }
  },

  /* 順序機關:照正確順序按按鈕(踩地磚、彈琴、按開關) */
  sequence: {
    validate(lv) {
      const e = [];
      if (!Array.isArray(lv.buttons) || lv.buttons.length < 2 || lv.buttons.some(b => !isText(b))) return ["buttons 至少要有 2 個不空白的文字"];
      if (new Set(lv.buttons).size !== lv.buttons.length) e.push("buttons 裡有重複的文字");
      if (!Array.isArray(lv.answer) || !lv.answer.length) e.push("answer 要是陣列,照順序寫出要按的按鈕文字");
      else lv.answer.forEach(a => { if (!lv.buttons.includes(a)) e.push(`answer 裡的「${a}」不在 buttons 裡`); });
      if (lv.tones !== undefined && (!Array.isArray(lv.tones) || lv.tones.length !== lv.buttons.length || lv.tones.some(t => !isNum(t)))) e.push("tones 要是數字陣列,數量和 buttons 一樣");
      if (lv.cols !== undefined && !(Number.isInteger(lv.cols) && lv.cols > 0)) e.push("cols 要是正整數");
      if (lv.blocked !== undefined) {
        if (!Array.isArray(lv.blocked) || lv.blocked.some(b => !(lv.buttons || []).includes(b))) e.push("blocked 要是 buttons 裡的文字陣列(不能按的格子)");
        else if (Array.isArray(lv.answer) && lv.answer.some(a => lv.blocked.includes(a))) e.push("answer 裡有 blocked 的格子,玩家按不到");
      }
      return e;
    },
    render(lv, ctx) {
      const cols = lv.cols || (lv.buttons.length <= 4 ? lv.buttons.length : 3);
      const blocked = lv.blocked || [];
      const trail = mk("div", "seq-trail");
      const grid = mk("div", "seq-grid");
      grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      const reset = mk("button", "link-btn", "↺ 重新來過");
      let picked = [], locked = false;
      const first = (p) => p.split("\n")[0];
      const paint = () => {
        trail.textContent = picked.length ? picked.map(first).join(" → ") : (lv.strict || lv.hideCount ? "依序按下" : `依序按 ${lv.answer.length} 個`);
        btns.forEach((b, i) => {      // 按過的格子保持亮著,標上第幾步
          const steps = picked.map((p, k) => p === lv.buttons[i] ? k + 1 : 0).filter(Boolean);
          b.classList.toggle("on", steps.length > 0);
          b.dataset.n = steps.join(",");
        });
      };
      const btns = lv.buttons.map((label, i) => {
        const b = mk("button", "seq-btn" + (blocked.includes(label) ? " blocked" : ""), label);
        b.disabled = blocked.includes(label);
        b.addEventListener("click", () => {
          if (locked) return;
          ctx.tone(lv.tones ? lv.tones[i] : 220 + i * 40, 0.3, lv.tones ? "sine" : "triangle");
          b.classList.add("lit");
          setTimeout(() => b.classList.remove("lit"), 250);
          picked.push(label);
          paint();
          // strict:每按一步就檢查,按錯立刻算答錯、全部熄滅;否則按滿才一起檢查
          const wrongStep = lv.strict && label !== lv.answer[picked.length - 1];
          if (!wrongStep && picked.length < lv.answer.length) return;
          setLock(true);
          const right = !wrongStep && picked.every((p, k) => p === lv.answer[k]);
          ctx.answer(right, picked.map(first).join("→")).then(() => { picked = []; paint(); setLock(false); });
        });
        grid.appendChild(b);
        return b;
      });
      function setLock(v) { locked = v; btns.forEach((b, i) => { b.disabled = v || blocked.includes(lv.buttons[i]); }); reset.disabled = v; }
      reset.addEventListener("click", () => { picked = []; paint(); });
      ctx.top.appendChild(trail);
      ctx.top.appendChild(grid);
      ctx.top.appendChild(reset);
      paint();
    }
  },

  /* 計數:用 + − 調到正確的數量。visual: "balance" 會畫天平,按確認後才往重的一邊傾斜 */
  counter: {
    validate(lv) {
      const r = validateRange(lv, 99);
      if (lv.visual !== undefined && lv.visual !== "balance" && lv.visual !== "cup") return ['visual 只能是 "balance"、"cup"(或不寫)'];
      return r;
    },
    render(lv, ctx) {
      const { min, max, step, start } = rangeOf(lv, 99);
      let value = start, touched = false;
      const row = mk("div", "stepper-row"), minus = mk("button", "round-btn", "−"), plus = mk("button", "round-btn", "+");
      const out = mk("div", "readout"), ok = confirmBtn(lv);
      minus.setAttribute("aria-label", "減少"); plus.setAttribute("aria-label", "增加");
      let beam = null, rightPan = null, water = null;
      if (lv.visual === "cup") {         // 量杯:每一格一條刻度,水位跟著數值變
        const cup = mk("div", "cup");
        cup.style.setProperty("--tick", `${200 / Math.max(1, Math.round((max - min) / step))}px`);
        water = mk("div", "water");
        cup.appendChild(water);
        ctx.top.appendChild(cup);
      }
      if (lv.visual === "balance") {
        const box = mk("div", "balance");
        box.innerHTML = '<div class="pillar"></div><div class="base"></div><div class="beam"><div class="pan left"><span></span></div><div class="pan right"><span></span></div></div>';
        beam = box.querySelector(".beam");
        rightPan = box.querySelector(".pan.right span");
        box.querySelector(".pan.left span").textContent = lv.leftLabel || "?";
        ctx.top.appendChild(box);
      }
      const tilt = () => { if (beam) beam.style.setProperty("--tilt", value === lv.answer ? "0deg" : value < lv.answer ? "-9deg" : "9deg"); };
      const paint = () => {
        out.innerHTML = `${escapeHtml(fmtNum(value))}<small>${escapeHtml(lv.unit || "")}</small>`;
        if (rightPan) rightPan.textContent = `${fmtNum(value)} ${lv.unit || ""}`;
        if (water) water.style.height = `${((value - min) / (max - min)) * 100}%`;
        minus.disabled = value <= min; plus.disabled = value >= max;
      };
      const change = (d) => { touched = true; value = Math.min(max, Math.max(min, value + d)); paint(); };
      minus.addEventListener("click", () => change(-step));
      plus.addEventListener("click", () => change(step));
      ok.addEventListener("click", () => {
        if (!touched) return;
        minus.disabled = plus.disabled = ok.disabled = true;
        tilt();
        ctx.answer(value === lv.answer, fmtNum(value)).then(() => { ok.disabled = false; paint(); });
      });
      row.appendChild(minus); row.appendChild(out); row.appendChild(plus);
      ctx.top.appendChild(row);
      ctx.top.appendChild(ok);
      paint();
      if (beam) beam.style.setProperty("--tilt", "-9deg");      // 一開始右盤是空的,左邊比較重
    }
  },

  /* 滑桿:拖到正確的數值。visual: "compass" 會畫一個指針跟著轉的羅盤(數值當作角度) */
  slider: {
    validate(lv) {
      if (!isNum(lv.min) || !isNum(lv.max)) return ["min 和 max 都要寫數字"];
      if (lv.tolerance !== undefined && !(isNum(lv.tolerance) && lv.tolerance >= 0)) return ["tolerance 要是 0 以上的數字"];
      if (lv.visual !== undefined && lv.visual !== "compass") return ['visual 只能是 "compass"(或不寫)'];
      return validateRange(lv, lv.max);
    },
    render(lv, ctx) {
      const { min, max, step, start } = rangeOf(lv, lv.max);
      let touched = false, needle = null;
      if (lv.visual === "compass") {
        const c = mk("div", "compass");
        needle = mk("div", "needle");
        [["e", "E"], ["s", "S"], ["w", "W"]].forEach(([cls, t]) => c.appendChild(mk("i", "compass-mark " + cls, t)));
        c.appendChild(needle);
        ctx.top.appendChild(c);
      }
      const out = mk("div", "readout");
      const input = mk("input", "slider");
      input.type = "range"; input.min = min; input.max = max; input.step = step; input.value = start;
      input.setAttribute("aria-label", lv.question);
      const ok = confirmBtn(lv);
      const paint = () => {
        out.innerHTML = `${escapeHtml(fmtNum(Number(input.value)))}<small>${escapeHtml(lv.unit || "")}</small>`;
        if (needle) needle.style.transform = `rotate(${Number(input.value)}deg)`;
      };
      input.addEventListener("input", () => { touched = true; paint(); });
      ok.addEventListener("click", () => {
        if (!touched) return;
        input.disabled = ok.disabled = true;
        const right = Math.abs(Number(input.value) - lv.answer) <= (lv.tolerance || 0) + 1e-9;
        ctx.answer(right, fmtNum(Number(input.value))).then(() => { input.disabled = ok.disabled = false; });
      });
      out.style.margin = "0 auto 4px";
      ctx.top.appendChild(out);
      ctx.top.appendChild(input);
      ctx.top.appendChild(ok);
      paint();
    }
  },

  /* 旋轉水管:點管件轉 90 度,接出一條從左上角(上方流入)到右下角(下方流出)的密閉水路。
     過關是照規則算水流(pipeFlow),不是比對 solution;solution 只用來驗算這一關有解 */
  pipes: {
    validate(lv) {
      const errors = [], warnings = [];
      if (!Number.isInteger(lv.size) || lv.size < 2 || lv.size > 6) return ["size 要是 2 到 6 的整數"];
      const cells = lv.size * lv.size;
      const rotList = (k) => Array.isArray(lv[k]) && lv[k].length === cells && lv[k].every(r => Number.isInteger(r) && r >= 0 && r <= 3);
      const cellList = (k) => lv[k] === undefined || (Array.isArray(lv[k]) && lv[k].every(i => Number.isInteger(i) && i >= 0 && i < cells));
      if (!Array.isArray(lv.tiles) || lv.tiles.length !== cells || lv.tiles.some(t => !PIPE_SHAPES[t])) errors.push(`tiles 要有 ${cells} 格,每格是 "I"(直管)、"L"(彎管)或 "T"(三通管)`);
      ["start", "solution"].forEach(k => { if (!rotList(k)) errors.push(`${k} 要有 ${cells} 個 0~3 的整數(每格順時針轉幾次 90 度)`); });
      ["valves", "shocks"].forEach(k => { if (!cellList(k)) errors.push(`${k} 要是格子索引的陣列(0 到 ${cells - 1})`); });
      if (errors.length) return errors;
      if ((lv.valves || []).some(i => (lv.shocks || []).includes(i))) errors.push("同一格不能既是 valves 又是 shocks");
      const sol = pipeFlow(lv, lv.solution).problem;
      if (sol) errors.push(`solution 這組轉法過不了關(${sol}),這一關可能無解`);
      if (!pipeFlow(lv, lv.start).problem) warnings.push("start 一開始就是通的,換一組起始轉法");
      return { errors, warnings };
    },
    render(lv, ctx) {
      const n = lv.size, turns = lv.start.slice();
      const styled = (tag, css, text) => { const e = mk(tag, "", text); e.style.cssText = css; return e; };
      const label = "color:var(--muted);font-size:.9rem;font-weight:700;max-width:380px;margin:0 auto 4px;";
      const grid = styled("div", `display:grid;grid-template-columns:repeat(${n},1fr);gap:6px;max-width:380px;margin:0 auto 4px;`);
      const ok = confirmBtn(lv);
      let touched = false, locked = false;

      const cells = lv.tiles.map((kind, i) => {
        const shock = (lv.shocks || []).includes(i), valve = (lv.valves || []).includes(i);
        const b = styled("button", `position:relative;aspect-ratio:1;padding:0;border:var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--pop-press);touch-action:manipulation;overflow:hidden;${shock ? "border-color:var(--bad);border-width:2px;" : ""}`);
        b.className = "pipe-cell";
        const arms = PIPE_SHAPES[kind].map(d => `<line x1="20" y1="20" x2="${20 + [0, 20, 0, -20][d]}" y2="${20 + [-20, 0, 20, 0][d]}" stroke="currentColor" stroke-width="11"/>`).join("");
        b.innerHTML = `<svg viewBox="0 0 40 40" aria-hidden="true" style="display:block;width:100%;height:100%;transition:transform .2s,color .2s">${arms}<circle cx="20" cy="20" r="5.5" fill="currentColor"/></svg>`;
        if (valve) b.appendChild(styled("span", "position:absolute;left:50%;top:50%;width:30%;height:30%;transform:translate(-50%,-50%);border-radius:50%;background:var(--butter);border:2px solid var(--surface);"));
        if (shock) b.appendChild(styled("span", "position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:1.3rem;line-height:1;", "⚡"));
        b.addEventListener("click", () => {
          if (locked) return;
          touched = true;
          turns[i]++;
          ctx.tone(260 + (turns[i] % 4) * 40, 0.05);
          paint();
        });
        grid.appendChild(b);
        return { b, svg: b.firstChild, kind, mark: valve ? "(閥門)" : shock ? "(危險)" : "" };
      });

      function paint() {
        const { wet } = pipeFlow(lv, turns);
        cells.forEach(({ b, svg, kind, mark }, i) => {
          svg.style.transform = `rotate(${turns[i] * 90}deg)`;
          svg.style.color = wet.has(i) ? "var(--pink)" : "var(--muted)";
          const dirs = pipeOpenings(kind, turns[i] % 4).map(d => "上右下左"[d]).join("、");
          b.setAttribute("aria-label", `第 ${Math.floor(i / n) + 1} 列第 ${i % n + 1} 格:${PIPE_NAMES[kind]}${mark},開口朝${dirs}${wet.has(i) ? ",已接通" : ""}`);
          b.disabled = locked;
        });
        ok.disabled = locked;
      }
      ok.addEventListener("click", () => {
        if (!touched) return;                        // 還沒動過管件就按,不算答錯
        locked = true; paint();
        const { problem } = pipeFlow(lv, turns);
        if (problem) ctx.toast(problem);
        ctx.answer(!problem).then(() => { locked = false; paint(); });
      });

      ctx.top.appendChild(styled("div", label, lv.inLabel || "💧 入口 ↓"));
      ctx.top.appendChild(grid);
      ctx.top.appendChild(styled("div", label + "text-align:right;margin-bottom:14px;", lv.outLabel || "↓ 出口"));
      ctx.top.appendChild(ok);
      paint();
    }
  },

  /* 放置:點一個物件,再點要放的格子(點已經放東西的格子可以拿回來)。也可以拿來做配對 */
  assign: {
    validate(lv) {
      const e = [];
      if (!Array.isArray(lv.slots) || !lv.slots.length || lv.slots.some(s => !isText(s))) return ["slots 要是至少有 1 個文字的陣列(每一格的名稱)"];
      if (!Array.isArray(lv.items) || !lv.items.length || lv.items.some(s => !isText(s))) return ["items 要是至少有 1 個文字的陣列(可以放的物件)"];
      if (!Array.isArray(lv.answer) || lv.answer.length !== lv.slots.length) return [`answer 要是陣列,長度和 slots 一樣(${lv.slots.length}),依序寫每一格該放的物件,留空寫 null`];
      if (lv.multiple && lv.answer.some(a => !Array.isArray(a))) return ['multiple: true 時,answer 的每一格要寫成陣列,例如 [["水筆仔", "矽藻"], ["彈塗魚"], []]'];
      const left = lv.items.slice();
      lv.answer.forEach((a, i) => {
        [].concat(a === null ? [] : a).forEach(x => {
          const k = left.indexOf(x);
          if (k < 0) e.push(`answer 第 ${i + 1} 格的「${x}」不在 items 裡(或數量不夠)`); else left.splice(k, 1);
        });
      });
      if (lv.answer.every(a => a === null || (Array.isArray(a) && !a.length))) e.push("answer 不能每一格都是空的");
      return e;
    },
    render(lv, ctx) {
      // 每一格放的是 items 的第幾個(陣列);multiple: true 時一格可以放很多個(分類),否則一格一個
      const placed = lv.slots.map(() => []);
      const order = shuffle(lv.items.map((_, i) => i));
      const grid = mk("div", "slots"), tray = mk("div", "chip-row"), ok = confirmBtn(lv);
      let selected = null, locked = false;
      const labels = (s) => placed[s].map(i => lv.items[i]);
      function paint() {
        grid.innerHTML = ""; tray.innerHTML = "";
        lv.slots.forEach((name, s) => {
          const b = mk("button", "slot" + (placed[s].length ? " filled" : ""));
          b.appendChild(mk("span", "slot-label", name));
          b.appendChild(mk("span", "slot-item", labels(s).join("、")));
          b.disabled = locked;
          b.addEventListener("click", () => {
            if (selected !== null) { if (lv.multiple) placed[s].push(selected); else placed[s] = [selected]; selected = null; ctx.sfx("item"); }
            else if (placed[s].length) placed[s].pop();          // 沒選物件時點格子:拿回最後放的那一個
            else ctx.toast("先點下面的物件,再點要放的格子");
            paint();
          });
          grid.appendChild(b);
        });
        order.forEach(i => {
          if (placed.some(p => p.includes(i))) return;
          const b = mk("button", "chip" + (selected === i ? " selected" : ""), lv.items[i]);
          b.disabled = locked;
          b.addEventListener("click", () => { selected = selected === i ? null : i; paint(); });
          tray.appendChild(b);
        });
        ok.disabled = locked;
      }
      ok.addEventListener("click", () => {
        if (placed.every(p => !p.length)) return;
        locked = true; selected = null; paint();
        const cell = (list) => [].concat(list === null ? [] : list).map(String).sort().join("+");
        const got = lv.slots.map((_, s) => cell(labels(s)));
        const want = lv.answer.map(cell);
        const key = (list) => (lv.anyOrder ? list.slice().sort() : list).join("\n");   // anyOrder:只看放了哪些,不看放在哪一格
        ctx.answer(key(got) === key(want), got.map(c => c || "空").join("、")).then(() => { locked = false; paint(); });     // 答錯保留擺法,讓玩家調整
      });
      ctx.top.appendChild(grid);
      ctx.top.appendChild(tray);
      ctx.top.appendChild(ok);
      paint();
    }
  }
};
/* 規則包沒有寫 LEVEL_TYPES 時,當作沒有自訂題型 */
const CUSTOM_TYPES = (typeof LEVEL_TYPES !== "undefined" && LEVEL_TYPES) ? LEVEL_TYPES : {};
const allTypes = () => ({ ...BUILTIN_TYPES, ...CUSTOM_TYPES });
const typeOf = (level) => allTypes()[level.type || "choice"];

/* ---------- 檢查資料 ----------
   開始畫面載入時執行。學員手改 LEVELS 很容易漏逗號、把答案寫成數字、答案索引超出範圍,
   有問題就在開始畫面顯示紅字、不讓開始遊戲,避免玩到一半才出現空白畫面。
   每種題型自己檢查自己的欄位(validate),新增題型時一起寫 */
function validateEngine() {
  const errors = [], warnings = [];
  if (!Array.isArray(LEVELS) || LEVELS.length === 0) return { errors: ["LEVELS 必須是一個至少有一關的陣列"], warnings };
  const types = allTypes();
  Object.entries(CUSTOM_TYPES).forEach(([name, t]) => {
    if (!t || typeof t.render !== "function" || typeof t.validate !== "function") errors.push(`LEVEL_TYPES 的「${name}」要有 validate(level) 和 render(level, ctx) 兩個函式`);
  });
  if (!Number.isInteger(GAME.lives) || GAME.lives < 0) errors.push("GAME.lives 要是 0 以上的整數(0 代表不限)");
  if (GAME.failTo !== "start" && GAME.failTo !== "level") errors.push('GAME.failTo 只能是 "start" 或 "level"');
  if (GAME.timeLimit !== undefined && (!Number.isInteger(GAME.timeLimit) || GAME.timeLimit < 0)) errors.push("GAME.timeLimit 要是 0 以上的整數(單位是秒,0 代表不限時)");
  if (GAME.theme !== undefined && !THEMES.includes(GAME.theme)) errors.push(`GAME.theme 只能是 ${THEMES.map(t => `"${t}"`).join("、")}`);
  Object.entries(ITEM_DEFS).forEach(([id, it]) => {
    if (!it || !isText(it.name)) errors.push(`ITEMS 的「${id}」要有 name(道具名稱)`);
  });
  const owned = new Set();          // 走到這一關之前已經拿到的道具
  LEVELS.forEach((lv, i) => {
    const name = `第 ${i + 1} 關`;
    if (!lv || typeof lv !== "object") { errors.push(`${name}:不是有效的關卡物件(檢查逗號和大括號)`); return; }
    if (!isText(lv.question)) errors.push(`${name}:question 要寫題目文字`);
    ["hint", "explanation", "title", "scene", "art", "success"].forEach(k => {
      if (lv[k] !== undefined && typeof lv[k] !== "string") errors.push(`${name}:${k} 要是文字`);
    });
    if (lv.hints !== undefined && (!Array.isArray(lv.hints) || lv.hints.some(h => !isText(h)))) errors.push(`${name}:hints 要是文字陣列(由淺到深的提示)`);
    if (lv.clues !== undefined && !Array.isArray(lv.clues)) errors.push(`${name}:clues 要是陣列`);
    (Array.isArray(lv.clues) ? lv.clues : []).forEach((c, k) => {
      const cn = `${name}的第 ${k + 1} 張線索`;
      if (typeof c === "string") { if (!c.trim()) errors.push(`${cn}:是空白的`); return; }
      if (!c || typeof c !== "object" || (!isText(c.text) && !isText(c.html))) { errors.push(`${cn}:要寫 text(文字)或 html(插圖)`); return; }
      [].concat(c.needs || []).forEach(id => {
        if (!ITEM_DEFS[id]) errors.push(`${cn}:needs 的道具「${id}」不在 ITEMS 裡`);
        else if (!owned.has(id)) errors.push(`${cn}:需要道具「${ITEM_DEFS[id].name}」,但前面沒有任何關卡的 reward 給這個道具,玩家會卡住`);
      });
    });
    [].concat(lv.needs || []).forEach(id => {
      if (!ITEM_DEFS[id]) errors.push(`${name}:needs 的道具「${id}」不在 ITEMS 裡`);
      else if (!owned.has(id)) errors.push(`${name}:需要道具「${ITEM_DEFS[id].name}」,但前面沒有任何關卡的 reward 給這個道具,玩家會卡住`);
    });
    if (lv.reward !== undefined && !Array.isArray(lv.reward)) errors.push(`${name}:reward 要是道具 id 的陣列,例如 ["key"]`);
    const type = lv.type || "choice";
    const t = types[type];
    if (!t) errors.push(`${name}:不認得的題型 "${type}",目前有 ${Object.keys(types).join("、")}`);
    else if (typeof t.validate === "function") {
      try {
        const r = t.validate(lv) || [];
        (Array.isArray(r) ? r : (r.errors || [])).forEach(m => errors.push(`${name}:${m}`));
        if (!Array.isArray(r)) (r.warnings || []).forEach(m => warnings.push(`${name}:${m}`));
      } catch (e) { errors.push(`${name}:檢查題型「${type}」時出錯:${e.message}`); }
    }
    if ((type === "choice" || type === "multi") && Array.isArray(lv.choices) && new Set(lv.choices).size !== lv.choices.length) warnings.push(`${name}:有兩個選項的文字一樣`);
    if (type === "passcode" && typeof lv.answer === "string" && lv.answer.length > 8) warnings.push(`${name}:密碼超過 8 格,在手機上可能排不下`);
    if (lv.mistakes !== undefined && !CUSTOM_TYPES[type]) {     // 自訂題型自己決定 mistakes 怎麼用
      if (!lv.mistakes || typeof lv.mistakes !== "object" || Array.isArray(lv.mistakes) || Object.values(lv.mistakes).some(v => !isText(v))) {
        errors.push(`${name}:mistakes 要寫成 { "錯誤答案": "給學生的話", ... }`);
      } else if (t) {
        let rights = [];
        try { rights = answerKeys(lv); } catch (e) { /* 資料有錯時上面已經報過 */ }
        rights.forEach(a => {
          if (a !== undefined && Object.keys(lv.mistakes).some(k => normKey(k) === normKey(a))) errors.push(`${name}:mistakes 裡的「${a}」其實是正確答案`);
        });
      }
    }
    (Array.isArray(lv.reward) ? lv.reward : []).forEach(id => {
      if (!ITEM_DEFS[id]) errors.push(`${name}:reward 的道具「${id}」不在 ITEMS 裡`);
      else if (owned.has(id)) warnings.push(`${name}:道具「${ITEM_DEFS[id].name}」前面的關卡已經給過了`);
      owned.add(id);
    });
  });
  Object.keys(ITEM_DEFS).forEach(id => { if (!owned.has(id)) warnings.push(`道具「${ITEM_DEFS[id].name || id}」沒有任何關卡的 reward 會給`); });
  if (GAME.lives > 0 && GAME.lives > LEVELS.length * 3) warnings.push("愛心數比關卡數的三倍還多,幾乎不可能失敗");
  if (GAME.timeLimit > 0 && GAME.timeLimit < LEVELS.length * 10) warnings.push("timeLimit 的單位是秒:目前平均每關不到 10 秒,幾乎不可能過關");
  const idx = LEVELS.filter(lv => lv && (lv.type || "choice") === "choice").map(lv => lv.answerIndex);
  if (GAME.shuffleChoices === false && idx.length >= 3 && idx.every(i => i === idx[0])) {
    warnings.push(`選項不會打亂(shuffleChoices 是 false),但每一題選擇題的正確答案都在第 ${idx[0] + 1} 個選項,玩家很快就會發現`);
  }
  return { errors, warnings };
}

/* 內建題型的正確答案,寫成 mistakes 比對用的樣子(用來檢查 mistakes 有沒有把正確答案寫進去) */
function answerKeys(lv) {
  const t = lv.type || "choice";
  if (t === "choice") return [lv.choices[lv.answerIndex]];
  if (t === "multi") return [lv.choices.filter((_, i) => lv.answerIndexes.includes(i)).join("、")];
  if (t === "passcode" || t === "text") return [].concat(lv.answer);
  if (t === "dial") return [dialKey(lv, dialParts(lv).ans)];
  if (t === "sequence") return [lv.answer.map(a => a.split("\n")[0]).join("→")];
  if (t === "counter" || t === "slider") return [fmtNum(lv.answer)];
  return [];
}

function paintList(id, title, items) {
  const box = el(id);
  const shown = items.slice(0, 12);
  box.innerHTML = "";
  if (items.length) {
    box.appendChild(document.createTextNode(title));
    const ul = document.createElement("ul");
    shown.forEach(m => { const li = document.createElement("li"); li.textContent = m; ul.appendChild(li); });
    if (items.length > shown.length) { const li = document.createElement("li"); li.textContent = `…還有 ${items.length - shown.length} 項`; ul.appendChild(li); }
    box.appendChild(ul);
  }
  box.classList.toggle("hidden", !items.length);
}
function runValidation() {
  const errors = [], warnings = [];
  const merge = (fn) => {
    try {
      const r = fn() || {};
      (r.errors || []).forEach(x => errors.push(x));
      (r.warnings || []).forEach(x => warnings.push(x));
    } catch (e) { errors.push("檢查程式出錯:" + e.message); }
  };
  merge(validateEngine);
  if (!errors.length) merge(() => rule("validateRules"));
  paintList("level-errors", "關卡資料有問題,請修正後重新整理:", errors);
  paintList("level-warnings", "提醒(不影響開始,但可能不是你要的設計):", warnings);
  el("btn-start").disabled = errors.length > 0;
  return { errors, warnings };
}

/* ---------- 存檔與續玩 ---------- */
function saveProgress(override) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, ...(override || {}) })); } catch (e) { /* 存不了就算了 */ }
}
function loadProgress() {
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { return false; }
  if (!raw) return false;
  try {
    const saved = JSON.parse(raw);
    // 存檔的關卡位置必須還在目前的 LEVELS 範圍內;
    // 改過關卡數量後,舊存檔可能超出範圍,這時直接丟掉,避免畫面空白或報錯
    const ok = Number.isInteger(saved.currentLevel) && saved.currentLevel >= 0 && saved.currentLevel < LEVELS.length;
    if (ok) {
      state = { ...state, ...saved };
      if (!Array.isArray(state.stars)) state.stars = [];
      state.items = Array.isArray(state.items) ? state.items.filter(id => ITEM_DEFS[id]) : [];
      return true;
    }
    localStorage.removeItem(STORAGE_KEY);
  } catch (e) { /* 存檔壞掉就當作沒有存檔,重新開始 */ }
  return false;
}
const freshState = (name) => ({ currentLevel: 0, correctCount: 0, wrongCount: 0, startTime: null, playerName: name || "", lives: 0, levelWrong: 0, stars: [], items: [], hintsUsed: 0, levelHints: 0, timeLeft: 0 });

function startGame() {
  if (runValidation().errors.length) return;
  const nameInput = el("player-name").value.trim();
  state.playerName = nameInput || "玩家";
  if (!state.startTime) state.startTime = Date.now();     // 續玩時保留原本的開始時間
  if (GAME.lives > 0 && (!(state.lives > 0) || state.lives > GAME.lives)) state.lives = GAME.lives;
  if (GAME.timeLimit > 0 && (!(state.timeLeft > 0) || state.timeLeft > GAME.timeLimit)) state.timeLeft = GAME.timeLimit;
  showScreen("screen-game");
  renderLevel(state.currentLevel);
  startTimer();
  saveProgress();
}
function showScreen(id) {
  ["screen-start", "screen-game", "screen-end", "screen-fail"].forEach(s => el(s).classList.toggle("hidden", s !== id));
  el("hint-modal").classList.add("hidden");
}

/* 吉祥物(或主題圖示)的表情:"happy" / "sad" / "" (回到平常) */
function setMascot(mood) {
  [el("game-mascot"), el("game-icon")].forEach(m => {
    m.classList.remove("happy", "sad");
    void m.getBoundingClientRect(); // 讓動畫可以連續重播
    if (mood) m.classList.add(mood);
  });
}

function renderLives() {
  const box = el("lives");
  box.classList.toggle("hidden", !(GAME.lives > 0));
  if (GAME.lives > 0) {
    const left = Math.max(0, state.lives);
    box.textContent = "❤️".repeat(left) + "🖤".repeat(Math.max(0, GAME.lives - left));
    box.setAttribute("aria-label", `剩 ${left} 顆愛心`);
  }
}

/* 關卡進度:12 關以內畫成一顆一顆的關卡節點,更多關就用進度條 */
function renderProgress(index) {
  const steps = LEVELS.length <= 12;
  el("stepper").classList.toggle("hidden", !steps);
  el("progress-wrap").classList.toggle("hidden", steps);
  el("progress-bar").style.width = Math.round((index / LEVELS.length) * 100) + "%";
  if (!steps) return;
  el("stepper").innerHTML = LEVELS.map((_, i) =>
    (i ? `<span class="step-line${i <= index ? " done" : ""}"></span>` : "")
    + `<span class="step${i < index ? " done" : i === index ? " now" : ""}">${i < index ? "✓" : i + 1}</span>`).join("");
}

/* ---------- 倒數計時 ----------
   只有在作答中才會扣時間:看解說、停在開始或結算畫面時不扣 */
let timerId = null;
function renderTimer() {
  const box = el("timer"), on = GAME.timeLimit > 0;
  box.classList.toggle("hidden", !on);
  if (!on) return;
  const t = Math.max(0, state.timeLeft);
  box.textContent = `⏱ ${String(Math.floor(t / 60)).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`;
  box.classList.toggle("danger", t <= 30);
}
function tick() {
  if (locked || el("screen-game").classList.contains("hidden")) return;
  state.timeLeft--;
  renderTimer();
  if (state.timeLeft <= 0) { locked = true; failGame("time"); return; }
  saveProgress();
}
function startTimer() {
  clearInterval(timerId);
  if (GAME.timeLimit > 0) timerId = setInterval(tick, 1000);
  renderTimer();
}

/* ---------- 道具袋 ---------- */
function renderInventory(fresh) {
  const box = el("inventory");
  box.classList.toggle("hidden", !Object.keys(ITEM_DEFS).length);
  box.innerHTML = "";
  box.appendChild(mk("span", "inv-label", state.items.length ? "🎒" : "🎒 還沒有道具"));
  state.items.forEach(id => {
    const it = ITEM_DEFS[id];
    if (!it) return;
    const chip = mk("button", "item-chip" + ((fresh || []).includes(id) ? " new" : ""), itemLabel(id));
    chip.title = it.desc || it.name;
    chip.addEventListener("click", () => toast(it.desc ? `${it.name}:${it.desc}` : it.name));
    box.appendChild(chip);
  });
}

/* ---------- 線索卡 ----------
   有 reveal 或 needs 的線索一開始蓋住,按下按鈕(需要的道具都有)才顯示 */
function renderClues(level) {
  const box = el("clues");
  box.innerHTML = "";
  (level.clues || []).forEach(raw => {
    const c = typeof raw === "string" ? { text: raw } : raw;
    const card = mk("div", "clue");
    if (c.title) card.appendChild(mk("h4", "clue-title", c.title));
    const body = mk("div", "clue-body");
    if (c.text) body.appendChild(document.createTextNode(c.text));
    if (c.html) { const h = mk("div"); h.innerHTML = c.html; body.appendChild(h); }   // html 是出題者自己寫的插圖,不是玩家輸入
    const needs = [].concat(c.needs || []);
    if (c.reveal || needs.length) {
      body.classList.add("hidden");
      const b = mk("button", "clue-reveal", c.reveal || `使用 ${needs.map(itemLabel).join(" + ")}`);
      b.addEventListener("click", () => {
        if (needs.some(id => !state.items.includes(id))) { sfx("wrong"); toast("還沒有拿到需要的道具"); return; }
        sfx("item");
        b.remove();
        body.classList.remove("hidden");
        body.classList.add("revealed");
      });
      card.appendChild(b);
    }
    card.appendChild(body);
    box.appendChild(card);
  });
}

/* ---------- 分層提示 ----------
   level.hints 由淺到深;玩家每按一次多看一層,看過的層數會記到 state.hintsUsed(給星星和結算用) */
function renderHints() {
  const level = LEVELS[state.currentLevel], hints = hintsOf(level), list = el("hint-list");
  list.innerHTML = "";
  hints.slice(0, state.levelHints).forEach((h, i) => {
    const tier = mk("div", "hint-tier");
    tier.appendChild(mk("b", "", hints.length > 1 ? `第 ${i + 1} 層提示` : "提示"));
    tier.appendChild(document.createTextNode(h));
    list.appendChild(tier);
  });
  if (state.levelHints < hints.length) {
    const more = mk("button", "btn-primary", state.levelHints ? `再看下一層(${state.levelHints + 1} / ${hints.length})` : `看提示(共 ${hints.length} 層)`);
    more.id = "btn-hint-more";
    more.addEventListener("click", () => {
      state.levelHints++;
      state.hintsUsed++;
      if (!locked) saveProgress();
      renderHints();
    });
    list.appendChild(more);
  }
}
function openHints() { renderHints(); el("hint-modal").classList.remove("hidden"); el("btn-hint-close").focus(); }
function closeHints() { el("hint-modal").classList.add("hidden"); }

/* ---------- 畫出目前這一關 ---------- */
let cleanup = null;
let locked = false;          // 這一關已經答對、正在換關,不再接受作答(不存檔)
let advanceTimer = null;
const ctx = {
  top: null, bottom: null,
  answer: (isCorrect, given) => answer(isCorrect, given),
  sfx, tone, toast,
  hasItem: (id) => state.items.includes(id)
};

function renderLevel(index) {
  if (cleanup) { try { cleanup(); } catch (e) { /* 題型的清理出錯不影響換關 */ } cleanup = null; }
  clearTimeout(advanceTimer);
  locked = false;
  const level = LEVELS[index];
  el("level-title").textContent = `${level.title || `第 ${index + 1} 關`}(${index + 1} / ${LEVELS.length})`;
  el("scene").textContent = level.scene || "";
  el("scene").classList.toggle("hidden", !level.scene);
  el("art").innerHTML = level.art || "";        // art 是出題者自己寫的插圖(行內 SVG 等),不是玩家輸入
  el("art").classList.toggle("hidden", !level.art);
  renderClues(level);
  el("question-text").textContent = level.question;
  el("feedback").textContent = "";
  el("feedback").className = "feedback";
  el("explain").classList.add("hidden");
  el("next-wrap").classList.add("hidden");
  el("btn-hint").classList.toggle("hidden", !hintsOf(level).length);
  closeHints();
  setMascot("");
  renderLives();
  renderTimer();
  renderInventory();
  const body = el("level-body");
  body.classList.remove("enter"); void body.offsetWidth; body.classList.add("enter");

  ctx.top = el("answer-top");
  ctx.bottom = el("answer-bottom");
  ctx.top.innerHTML = "";
  ctx.bottom.innerHTML = "";
  ctx.bottom.classList.remove("hidden");
  cleanup = typeOf(level).render(level, ctx) || null;
  // 關卡有 needs:機關先蓋住,玩家按「使用道具」才能操作
  const needs = [].concat(level.needs || []);
  el("gate").classList.toggle("hidden", !needs.length);
  ctx.top.classList.toggle("hidden", !!needs.length);
  ctx.bottom.classList.toggle("hidden", !!needs.length);
  el("btn-gate").textContent = level.needsLabel || `使用 ${needs.map(itemLabel).join(" + ")}`;

  renderProgress(index);
}

/* ---------- 處理作答 ----------
   題型呼叫 ctx.answer(isCorrect):
   答對 → 記星星、發道具、顯示回饋(有解說就停住等玩家按「下一關」,沒有就稍後自動換關);Promise 不會 resolve
   答錯 → 計次、扣愛心、顯示提示;愛心用完就挑戰失敗,否則 0.6 秒後 resolve,題型把輸入重新打開
   所有「換關卡」的動作都要經過 goToNextLevel(),不要在別的地方直接改 state.currentLevel */
function answer(isCorrect, given) {
  const never = new Promise(() => {});
  if (locked) return never;
  const level = LEVELS[state.currentLevel];
  if (isCorrect) {
    locked = true;
    state.correctCount++;
    const stars = Math.max(0, Math.min(3, Math.round(rule("levelStars", state.levelWrong, level, state.levelHints) || 0)));
    state.stars.push(stars);
    const got = (level.reward || []).filter(id => ITEM_DEFS[id] && !state.items.includes(id));
    state.items.push(...got);
    if (got.length) renderInventory(got);
    showFeedback(true, level, stars, got);
    // 這裡不存檔:關卡位置要到 goToNextLevel() 才前進,現在存的話,
    // 停在解說畫面重新整理會回到同一關再答對一次,答對數和星星就重複計算了
    if (level.explanation) {
      el("explain").textContent = level.explanation;
      el("explain").classList.remove("hidden");
      el("answer-bottom").classList.add("hidden");
      const last = state.currentLevel === LEVELS.length - 1;
      el("btn-next").textContent = last ? "完成 ▶" : "下一關 ▶";
      el("next-wrap").classList.remove("hidden");
      el("btn-next").focus();
    } else {
      advanceTimer = setTimeout(goToNextLevel, (level.success || got.length) ? 1800 : 800);   // 有劇情文字或道具時多停一下讓玩家讀
    }
    return never;
  }
  state.wrongCount++;
  state.levelWrong++;
  if (GAME.lives > 0) state.lives--;
  renderLives();
  showFeedback(false, level, 0, null, given);
  if (GAME.lives > 0 && state.lives <= 0) {
    locked = true;
    saveAfterFail();
    setTimeout(() => failGame("lives"), 700);
    return never;
  }
  saveProgress();
  return new Promise(resolve => setTimeout(resolve, 600));
}

/* 挑戰失敗時的存檔:
   failTo "level" → 留著存檔(愛心和時間補滿、這一關重新計次),在失敗畫面重新整理也能從這一關繼續
   failTo "start" → 刪掉存檔,重新整理就是從第一關開始 */
function saveAfterFail() {
  if (GAME.failTo === "level") {
    saveProgress({ lives: GAME.lives, levelWrong: 0, timeLeft: GAME.timeLimit || 0 });
  } else {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignore */ }
  }
}

/* 答錯時,依玩家給的答案找 level.mistakes 裡對應的話(忽略空白、大小寫、全半形) */
const normKey = (s) => String(s).normalize("NFKC").replace(/\s+/g, "").toLowerCase();
function mistakeFor(level, given) {
  if (!level.mistakes || given === undefined || given === null) return "";
  const k = Object.keys(level.mistakes).find(k => normKey(k) === normKey(given));
  return k ? level.mistakes[k] : "";
}
function showFeedback(isCorrect, level, stars, got, given) {
  if (isCorrect) {
    const starText = GAME.showStars && stars ? " " + "⭐".repeat(stars) : "";
    const last = state.currentLevel === LEVELS.length - 1;
    const itemText = got && got.length ? `\n🎒 獲得:${got.map(itemLabel).join("、")}` : "";
    el("feedback").textContent = (level.success || (last ? "答對了!全部過關 🎉" : "答對了!往下一關出發 ✨")) + starText + itemText;
    el("feedback").className = "feedback good";
    setMascot("happy");
    sfx(got && got.length ? "item" : "right");
  } else {
    const mistake = mistakeFor(level, given);
    el("feedback").textContent = mistake ? `🤔 ${mistake}` : level.hint ? `再想想:${level.hint}` : (hintsOf(level).length ? "不對喔,再試一次!卡住了可以按上面的「💡 提示」" : "再試一次!");
    el("feedback").className = "feedback bad";
    setMascot("sad");
    sfx("wrong");
  }
}

/* ---------- 前進下一關(所有「換關卡」的動作都要經過這個函式) ---------- */
function goToNextLevel() {
  state.currentLevel++;
  state.levelWrong = 0;
  state.levelHints = 0;
  saveProgress();
  if (state.currentLevel >= LEVELS.length) {
    finishGame();
  } else {
    renderLevel(state.currentLevel);
  }
}

/* ---------- 遊戲結束:通關或挑戰失敗 ---------- */
function makeInfo(result) {
  return {
    playerName: state.playerName,
    result,
    levelsPassed: state.correctCount,
    totalLevels: LEVELS.length,
    wrongCount: state.wrongCount,
    hintsUsed: state.hintsUsed,
    totalStars: state.stars.reduce((a, b) => a + b, 0),
    durationSec: Math.round((Date.now() - state.startTime) / 1000),
    timeLeft: Math.max(0, state.timeLeft)
  };
}
function renderSummary(id, info) {
  el(id).innerHTML = rule("summaryRows", info)
    .map(([k, v]) => `<div class="summary-row"><span>${escapeHtml(k)}</span><span>${escapeHtml(v)}</span></div>`).join("");
}
function showStory(id, text) {
  el(id).textContent = text || "";
  el(id).classList.toggle("hidden", !text);
}

/* payload 裡的欄位由使用者決定;加欄位時 gas-backend.gs 的 HEADERS 和 rowFor() 也要對應 */
function uploadResult(info) {
  sendResultsToSheet({
    playerName: info.playerName,
    totalLevels: info.totalLevels,
    levelsPassed: info.levelsPassed,
    wrongCount: info.wrongCount,
    totalStars: info.totalStars,
    result: info.result,
    durationSec: info.durationSec
  });
}

function finishGame() {
  const info = makeInfo("pass");
  renderProgress(LEVELS.length);
  showScreen("screen-end");
  showStory("end-story", GAME.ending);
  renderSummary("end-summary", info);
  sfx("win");
  uploadResult(info);
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignore */ }
}

/* reason:"lives" 愛心用完 / "time" 時間到 */
function failGame(reason) {
  const info = makeInfo("fail");
  const why = reason === "time" ? "時間到了" : "愛心用完了";
  showScreen("screen-fail");
  showStory("fail-story", GAME.failStory);
  el("fail-text").textContent = GAME.failTo === "level"
    ? `${why}。再試一次,會從第 ${state.currentLevel + 1} 關重新開始(愛心和時間補滿)。`
    : `${why}。再試一次,會從第一關重新開始。`;
  renderSummary("fail-summary", info);
  el("submit-status").textContent = "";
  sfx("fail");
  uploadResult(info);
  saveAfterFail();
}

function retryAfterFail() {
  el("submit-status").textContent = "";
  if (GAME.failTo === "level") {
    state.lives = GAME.lives;
    state.levelWrong = 0;
  } else {
    state = freshState(state.playerName);
    state.startTime = Date.now();
    state.lives = GAME.lives;
  }
  state.timeLeft = GAME.timeLimit || 0;
  showScreen("screen-game");
  renderLevel(state.currentLevel);
  startTimer();
  saveProgress();
}

/* ---------- 送資料到 Google Apps Script ----------
   使用 no-cors 模式:前端讀不到回應內容是正常現象,
   不代表送出失敗,不要改成用回應內容判斷成功與否 */
function sendResultsToSheet(payload) {
  const statusEl = el("submit-status");
  if (!GAS_URL || GAS_URL.indexOf("PASTE_YOUR") === 0) {
    statusEl.textContent = "(尚未設定 Google 試算表網址,成績只顯示在畫面上)";
    return;
  }
  statusEl.textContent = "成績上傳中...";
  fetch(GAS_URL, {
    method: "POST",
    mode: "no-cors",
    // no-cors 模式下瀏覽器只允許 text/plain 這類簡單的 Content-Type;後端一樣用 JSON.parse 讀內容
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    keepalive: true,               // 玩家一看到結算就關分頁,這筆成績也還是會送出去
    body: JSON.stringify(payload)
  }).then(() => {
    statusEl.textContent = "成績已送出 ✅";
  }).catch(() => {
    statusEl.textContent = "送出失敗,請檢查網路連線";
  });
}

/* ---------- 初始化與事件綁定 ---------- */
function resetProgress() {
  state = freshState("");
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignore */ }
  el("player-name").value = "";
  el("btn-start").textContent = "開始闖關";
  el("btn-reset").classList.add("hidden");
}
el("btn-start").addEventListener("click", startGame);
el("btn-reset").addEventListener("click", resetProgress);
el("btn-next").addEventListener("click", goToNextLevel);
el("btn-retry").addEventListener("click", retryAfterFail);
el("btn-gate").addEventListener("click", () => {
  const needs = [].concat(LEVELS[state.currentLevel].needs || []);
  if (needs.some(id => !state.items.includes(id))) { sfx("wrong"); toast("還沒有拿到需要的道具"); return; }
  sfx("item");
  el("gate").classList.add("hidden");
  ctx.top.classList.remove("hidden");
  ctx.bottom.classList.remove("hidden");
});
el("btn-hint").addEventListener("click", openHints);
el("btn-hint-close").addEventListener("click", closeHints);
el("hint-modal").addEventListener("click", (e) => { if (e.target === el("hint-modal")) closeHints(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeHints(); });
el("btn-sound").addEventListener("click", () => {
  soundOn = !soundOn;
  el("btn-sound").textContent = soundOn ? "🔊" : "🔇";
  sfx("click");
});
el("btn-restart").addEventListener("click", () => {
  state = freshState("");
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignore */ }
  showScreen("screen-start");
  el("player-name").value = "";
  el("submit-status").textContent = "";
  el("btn-start").textContent = "開始闖關";
  el("btn-reset").classList.add("hidden");
});

document.documentElement.dataset.theme = THEMES.includes(GAME.theme) ? GAME.theme : "cute";
document.querySelectorAll('.icon-badge[data-icon="game"]').forEach(b => { b.textContent = GAME.icon || "🗝️"; });
el("btn-sound").textContent = soundOn ? "🔊" : "🔇";
if (GAME.title) {
  el("game-title").textContent = GAME.title;
  document.title = GAME.title;     // 瀏覽器分頁的標題也跟著 GAME.title,不用另外改 <title>
}
if (GAME.desc) el("game-desc").textContent = GAME.desc;
showStory("game-story", GAME.story);
el("teacher-text").textContent = GAME.teacherNotes || "";
el("teacher-notes").classList.toggle("hidden", !GAME.teacherNotes);
if (GAME.endTitle) el("end-title").textContent = GAME.endTitle;
if (!runValidation().errors.length && loadProgress()) {
  el("player-name").value = state.playerName;
  el("btn-start").textContent = `繼續闖關(第 ${state.currentLevel + 1} 關)`;
  el("btn-reset").classList.remove("hidden");
}
window.__engineReady = true;   // 之後的錯誤不再由最上面的錯誤顯示處理
</script>

</body>
